spring.application.name=APIGateway

server.port=8080
eureka.instance.appname=api-gateway-service
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost


spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://UserService
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webmvc.routes[1].id=complaint-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ComplaintService
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/complaint/**

spring.cloud.gateway.server.webmvc.routes[2].id=assignment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://AssignmentService
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/assignment/**

spring.cloud.gateway.server.webmvc.routes[3].id=notification-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://NotificationService
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/notification/**

