spring.application.name=UserService

server.port=8001

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sdpuserdb?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Configuration
eureka.instance.appname=user-service
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

jwt.secret=${JWT_SECRET}
jwt.expiration=600000
# ==========================
# Resilience4j Circuit Breaker
# ==========================

resilience4j.circuitbreaker.instances.ComplaintService.register-health-indicator=true
resilience4j.circuitbreaker.instances.ComplaintService.sliding-window-size=5
resilience4j.circuitbreaker.instances.ComplaintService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ComplaintService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ComplaintService.permitted-number-of-calls-in-half-open-state=2

# ==========================
# Debug Logging
# ==========================

logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j.circuitbreaker.internal.CircuitBreakerStateMachine=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG